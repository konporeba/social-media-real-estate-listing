name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.11.4
      - run: ruff check .
      - run: ruff format --check .

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build browser-worker image
        uses: docker/build-push-action@v6
        with:
          context: ./browser-worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy env file
        run: cp .env.example .env
      - name: Boot services
        run: docker compose up -d --build --wait
        timeout-minutes: 10
      - name: Check backend /health
        run: curl -sf http://localhost:8000/health | grep '"ok"'
      - name: Tear down
        if: always()
        run: docker compose down -v

  schema-diff:
    name: Schema diff
    runs-on: ubuntu-latest
    # Only runs when Supabase secrets are configured in GitHub
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check for schema drift
        run: supabase db diff --project-ref "$SUPABASE_PROJECT_REF" --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only runs when Supabase secrets are configured in GitHub
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run schema integration tests
        run: pytest backend/tests/test_schema.py -v
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
